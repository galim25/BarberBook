name: barberbook

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No `ports:` — only reachable from other containers on this compose
    # network (barberbook_default), never published to the host/internet.

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        # Build-time, not runtime: next build inlines NEXT_PUBLIC_* into the
        # client bundle, so env_file below is too late for it. Compose
        # interpolates this from the root .env. See the ARG in Dockerfile.
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    # Not published to the host either — nginx is the only public entrypoint,
    # reaching this over the internal compose network as http://web:3000.
    expose:
      - "3000"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    # nginx:alpine auto-renders *.template files in /etc/nginx/templates into
    # /etc/nginx/conf.d/*.conf via envsubst on container start (built-in
    # docker-entrypoint.d script) — no custom entrypoint needed here.

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # Renews twice a day (certbot no-ops unless a cert is within 30 days of
    # expiry); initial issuance is a one-off manual command — see docs/DEPLOY.md.
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

volumes:
  pgdata:
  certbot-www:
  certbot-certs:
